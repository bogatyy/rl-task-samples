name: Agent starter stubs

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/check_starter_stubs.py
      - run: python3 scripts/test_check_starter_stubs.py -q
